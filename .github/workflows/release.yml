name: Release Obsidian plugin
on:
  push:
    tags: ['*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:release
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
      - name: Create and publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          files=(main.js manifest.json)
          if [ -f styles.css ]; then files+=(styles.css); fi
          sha256sum "${files[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --draft --title "Mathfolio $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release view "$GITHUB_REF_NAME" --json tagName,assets > "$RUNNER_TEMP/release.json"
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const release = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/release.json', 'utf8'));
          assert.equal(release.tagName, process.env.GITHUB_REF_NAME);
          assert.deepEqual(release.assets.map(asset => asset.name).sort(), ['main.js', 'manifest.json', 'styles.css']);
          JS
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
